# Normal-mode editing commands (including the most common operator+object
# compositions as ready-made entries, because they are what people ask for).

- id: delete-char
  keys: "x"
  kind: command
  category: editing/delete
  description: Delete the character under the cursor.
  aliases:
  - delete a character
  - remove the character under the cursor
  - delete letter
  help_tag: "x"
  alternatives: [delete-char-before, substitute-char]
  example:
    before: "ab┃cd"
    after: "ab┃d"
  verified: example

- id: delete-char-before
  keys: "X"
  kind: command
  category: editing/delete
  description: Delete the character before the cursor.
  aliases:
  - delete character to the left
  - backspace in normal mode
  - remove previous character
  help_tag: "X"
  alternatives: [delete-char]
  example:
    before: "ab┃cd"
    after: "a┃cd"
  verified: example

- id: delete-line
  keys: "dd"
  kind: command
  category: editing/delete
  description: Delete the current line.
  aliases:
  - delete the whole line
  - delete a line
  - remove the whole line
  - cut the current line
  - delete this line
  help_tag: "dd"
  alternatives: [delete-to-eol, delete-lines-count, change-line]
  example:
    before: "one\ntw┃o\nthree"
    after: "one\nth┃ree"
  verified: example

- id: delete-lines-count
  keys: "{count}dd"
  kind: command
  category: editing/delete
  description: Delete {count} lines starting at the cursor.
  aliases:
  - delete multiple lines
  - delete the next 3 lines
  - remove several lines
  help_tag: "dd"
  alternatives: [delete-line, delete-to-end-of-file]
  example:
    keys: "2dd"
    before: "one\ntw┃o\nthree\nfour"
    after: "one\nfo┃ur"
  verified: example

- id: delete-to-eol
  keys: "D"
  kind: command
  category: editing/delete
  description: Delete from the cursor to the end of the line.
  aliases:
  - delete to end of line
  - delete rest of line
  - remove everything after the cursor on this line
  help_tag: "D"
  alternatives: [change-to-eol, delete-to-line-start]
  example:
    before: "one ┃two three"
    after: "one┃ "
  verified: example

- id: delete-to-line-start
  keys: "d0"
  kind: command
  category: editing/delete
  description: Delete from the cursor to the start of the line.
  aliases:
  - delete to beginning of line
  - delete everything before the cursor on this line
  - remove start of line
  help_tag: "d"
  alternatives: [delete-to-eol, delete-line]
  example:
    before: "one two ┃three"
    after: "┃three"
  verified: example

- id: delete-word
  keys: "dw"
  kind: command
  category: editing/delete
  description: Delete from the cursor to the start of the next word.
  aliases:
  - delete a word
  - delete word forward
  - remove the next word
  - delete to next word
  help_tag: "d"
  alternatives: [delete-inner-word, delete-a-word, change-word]
  example:
    before: "one ┃two three"
    after: "one ┃three"
  verified: example

- id: delete-inner-word
  keys: "diw"
  kind: command
  category: editing/delete
  description: Delete the word under the cursor (cursor can be anywhere in it).
  aliases:
  - delete the current word
  - delete word under cursor
  - remove the word i am on
  help_tag: "iw"
  alternatives: [delete-a-word, delete-word, change-inner-word]
  example:
    before: "one tw┃o three"
    after: "one ┃ three"
  verified: example

- id: delete-a-word
  keys: "daw"
  kind: command
  category: editing/delete
  description: Delete the word under the cursor together with the following space.
  aliases:
  - delete word and its space
  - delete whole word including whitespace
  - remove word cleanly
  help_tag: "aw"
  alternatives: [delete-inner-word, delete-word]
  example:
    before: "one tw┃o three"
    after: "one ┃three"
  verified: example

- id: delete-to-end-of-file
  keys: "dG"
  kind: command
  category: editing/delete
  description: Delete from the current line to the end of the file.
  aliases:
  - delete everything below
  - delete to end of file
  - remove all following lines
  help_tag: "G"
  alternatives: [delete-to-start-of-file, delete-all]
  example:
    before: "one\ntw┃o\nthree\nfour"
    after: "on┃e"
  verified: example

- id: delete-to-start-of-file
  keys: "dgg"
  kind: command
  category: editing/delete
  description: Delete from the current line to the start of the file.
  aliases:
  - delete everything above
  - delete to top of file
  - remove all preceding lines
  help_tag: "gg"
  alternatives: [delete-to-end-of-file, delete-all]
  example:
    before: "one\ntwo\nth┃ree\nfour"
    after: "fo┃ur"
  verified: example

- id: delete-all
  keys: "ggdG"
  kind: command
  category: editing/delete
  description: Delete the entire buffer contents.
  aliases:
  - delete everything
  - clear the whole file
  - remove all lines
  - empty the buffer
  help_tag: "dd"
  alternatives: [delete-all-ex, yank-all]
  example:
    before: "one\ntw┃o\nthree"
    after: "┃"
  verified: example

- id: delete-all-ex
  keys: ":%d"
  kind: ex
  mode: normal
  category: editing/delete
  description: Delete all lines (ex command).
  aliases:
  - delete every line with an ex command
  - clear buffer with colon command
  help_tag: ":d"
  alternatives: [delete-all]
  example:
    before: "one\ntw┃o\nthree"
    after: "┃"
  verified: example

- id: delete-paragraph
  keys: "dap"
  kind: command
  category: editing/delete
  description: Delete the current paragraph including its trailing blank line.
  aliases:
  - delete a paragraph
  - remove the block of text i am in
  - delete lines up to blank line
  help_tag: "ap"
  alternatives: [delete-inner-paragraph, to-a-paragraph]
  example:
    before: "a\n\nb\nc┃\nd\n\ne"
    after: "a\n\n┃e"
  verified: example

- id: delete-inner-paragraph
  keys: "dip"
  kind: command
  category: editing/delete
  description: Delete the current paragraph, keeping the surrounding blank lines.
  aliases:
  - delete paragraph but keep blank line
  help_tag: "ip"
  alternatives: [delete-paragraph]
  example:
    before: "a\n\nb\nc┃\nd\n\ne"
    after: "a\n\n┃\ne"
  verified: example

- id: delete-inside-parens
  keys: "di("
  kind: command
  category: editing/delete
  description: Delete inside the nearest enclosing ( ).
  aliases:
  - delete everything inside the parentheses
  - clear the contents of the brackets
  - remove arguments of function call
  - delete between parens
  help_tag: "i("
  alternatives: [delete-around-parens, change-inside-parens, delete-inside-quotes]
  example:
    before: "print(foo, ba┃r)"
    after: "print(┃)"
  verified: example

- id: delete-around-parens
  keys: "da("
  kind: command
  category: editing/delete
  description: Delete the nearest enclosing ( ) including the parentheses.
  aliases:
  - delete the parentheses and what is inside them
  - delete parentheses and their contents
  - remove the whole paren group
  help_tag: "a("
  alternatives: [delete-inside-parens]
  example:
    before: "x = (foo + ba┃r) * 2"
    after: "x = ┃ * 2"
  verified: example

- id: delete-inside-braces
  keys: "di{"
  kind: command
  category: editing/delete
  description: Delete inside the nearest enclosing { }.
  aliases:
  - delete everything inside curly braces
  - clear the body of the block
  - empty the function body
  help_tag: "i{"
  alternatives: [delete-inside-parens, change-inside-braces]
  example:
    before: "f() { ret┃urn 1; }"
    after: "f() {┃}"
  verified: example

- id: delete-inside-brackets
  keys: "di["
  kind: command
  category: editing/delete
  description: Delete inside the nearest enclosing [ ].
  aliases:
  - delete everything inside square brackets
  - clear the array literal
  help_tag: "i["
  alternatives: [delete-inside-parens]
  example:
    before: "xs = [1, ┃2, 3]"
    after: "xs = [┃]"
  verified: example

- id: delete-inside-quotes
  keys: "di\""
  kind: command
  category: editing/delete
  description: Delete inside the nearest double-quoted string.
  aliases:
  - delete the text inside the quotes
  - clear the string contents
  - remove everything between double quotes
  help_tag: iquote
  alternatives: [change-inside-quotes, delete-inside-parens]
  example:
    before: "say(\"hel┃lo\")"
    after: "say(\"┃\")"
  verified: example

- id: delete-inside-tag
  keys: "dit"
  kind: command
  category: editing/delete
  description: Delete inside the nearest enclosing HTML/XML tag pair.
  aliases:
  - delete the content of an html tag
  - clear text between tags
  help_tag: "it"
  alternatives: [change-inside-tag]
  example:
    before: "<b>bo┃ld</b>"
    after: "<b>┃</b>"
  verified: example

- id: change-word
  keys: "cw"
  kind: command
  category: editing/change
  description: Change from the cursor to the end of the word (deletes it and enters insert mode).
  aliases:
  - change a word
  - replace word from cursor
  - retype the rest of the word
  help_tag: "cw"
  alternatives: [change-inner-word, change-to-eol]
  example:
    keys: "cwNEW<Esc>"
    before: "one ┃two three"
    after: "one NE┃W three"
  verified: example

- id: change-inner-word
  keys: "ciw"
  kind: command
  category: editing/change
  description: Change the whole word under the cursor (deletes it and enters insert mode).
  aliases:
  - replace the word under the cursor
  - change the current word
  - retype a word
  - overwrite word i am on
  help_tag: "iw"
  alternatives: [change-word, delete-inner-word]
  example:
    keys: "ciwNEW<Esc>"
    before: "one tw┃o three"
    after: "one NE┃W three"
  verified: example

- id: change-to-eol
  keys: "C"
  kind: command
  category: editing/change
  description: Change from the cursor to the end of the line.
  aliases:
  - change to end of line
  - delete rest of line and insert
  - replace everything after the cursor
  help_tag: "C"
  alternatives: [delete-to-eol, change-line]
  example:
    keys: "Cnew<Esc>"
    before: "one ┃two three"
    after: "one ne┃w"
  verified: example

- id: change-line
  keys: "cc"
  kind: command
  category: editing/change
  description: Change the whole line (deletes its text, keeps indent, enters insert mode).
  aliases:
  - replace the whole line
  - clear line and start typing
  - retype the current line
  help_tag: "cc"
  alternatives: [change-to-eol, delete-line, change-line-s]
  example:
    keys: "ccnew<Esc>"
    before: "one\ntw┃o\nthree"
    after: "one\nne┃w\nthree"
  verified: example

- id: change-line-s
  keys: "S"
  kind: command
  category: editing/change
  description: Same as cc, change the whole line.
  aliases:
  - substitute line
  help_tag: "S"
  alternatives: [change-line]
  example:
    keys: "Snew<Esc>"
    before: "one\ntw┃o\nthree"
    after: "one\nne┃w\nthree"
  verified: example

- id: change-inside-parens
  keys: "ci("
  kind: command
  category: editing/change
  description: Change the text inside the nearest enclosing ( ).
  aliases:
  - replace the arguments of a function call
  - retype what is inside the parentheses
  - change contents of brackets
  help_tag: "i("
  alternatives: [delete-inside-parens, change-inside-quotes]
  example:
    keys: "ci(x<Esc>"
    before: "print(foo, ba┃r)"
    after: "print(┃x)"
  verified: example

- id: change-inside-braces
  keys: "ci{"
  kind: command
  category: editing/change
  description: Change the text inside the nearest enclosing { }.
  aliases:
  - replace the body of the block
  - retype what is inside curly braces
  help_tag: "i{"
  alternatives: [delete-inside-braces, change-inside-parens]
  example:
    keys: "ci{x<Esc>"
    before: "f() { ret┃urn 1; }"
    after: "f() {┃x}"
  verified: example

- id: change-inside-quotes
  keys: "ci\""
  kind: command
  category: editing/change
  description: Change the text inside the nearest double-quoted string.
  aliases:
  - replace the string contents
  - retype what is inside the quotes
  - change text in quotes
  help_tag: iquote
  alternatives: [delete-inside-quotes, change-inside-parens]
  example:
    keys: "ci\"bye<Esc>"
    before: "say(\"hel┃lo\")"
    after: "say(\"by┃e\")"
  verified: example

- id: change-inside-tag
  keys: "cit"
  kind: command
  category: editing/change
  description: Change the text inside the nearest enclosing HTML/XML tag pair.
  aliases:
  - replace the content of an html tag
  - retype text between tags
  help_tag: "it"
  alternatives: [delete-inside-tag]
  example:
    keys: "citx<Esc>"
    before: "<b>bo┃ld</b>"
    after: "<b>┃x</b>"
  verified: example

- id: substitute-char
  keys: "s"
  kind: command
  category: editing/change
  description: Delete the character under the cursor and enter insert mode.
  aliases:
  - replace one character with several
  - delete character and start typing
  - substitute character
  help_tag: "s"
  alternatives: [replace-char, delete-char]
  example:
    keys: "sXY<Esc>"
    before: "ab┃cd"
    after: "abX┃Yd"
  verified: example

- id: replace-char
  keys: "r{char}"
  kind: command
  category: editing/change
  description: Replace the character under the cursor with {char}.
  aliases:
  - replace a single character
  - change one letter
  - overwrite character under cursor
  help_tag: "r"
  alternatives: [substitute-char, replace-mode]
  example:
    keys: "rX"
    before: "ab┃cd"
    after: "ab┃Xd"
  verified: example

- id: replace-mode
  keys: "R"
  kind: command
  category: editing/change
  description: Enter Replace mode, overwriting characters as you type.
  aliases:
  - overwrite mode
  - overtype text
  - replace several characters by typing over them
  help_tag: "R"
  alternatives: [replace-char, substitute-char]
  example:
    keys: "RXY<Esc>"
    before: "ab┃cd"
    after: "abX┃Y"
  verified: example

- id: join-lines
  keys: "J"
  kind: command
  category: editing/lines
  description: Join the current line with the next, inserting one space.
  aliases:
  - join lines
  - merge two lines
  - join the next line to this one
  - put the next line on this line
  help_tag: "J"
  alternatives: [join-lines-nospace, join-lines-count]
  example:
    before: "on┃e\ntwo\nthree"
    after: "one┃ two\nthree"
  verified: example

- id: join-lines-count
  keys: "{count}J"
  kind: command
  category: editing/lines
  description: Join {count} lines starting at the cursor.
  aliases:
  - join several lines
  - join the next 3 lines
  - merge multiple lines into one
  help_tag: "J"
  alternatives: [join-lines, visual-join]
  example:
    keys: "3J"
    before: "on┃e\ntwo\nthree\nfour"
    after: "one two┃ three\nfour"
  verified: example

- id: join-lines-nospace
  keys: "gJ"
  kind: command
  category: editing/lines
  description: Join the current line with the next without inserting a space.
  aliases:
  - join lines without space
  - concatenate lines directly
  help_tag: "gJ"
  alternatives: [join-lines]
  example:
    before: "on┃e\ntwo"
    after: "one┃two"
  verified: example

- id: undo
  keys: "u"
  kind: command
  category: editing/undo
  description: Undo the last change.
  aliases:
  - undo
  - revert last change
  - take back the last edit
  - oops undo that
  help_tag: "u"
  alternatives: [redo, undo-line]
  setup_keys: "x"
  example:
    before: "ab┃cd"
    after: "ab┃cd"
  verified: example

- id: redo
  keys: "<C-r>"
  kind: command
  category: editing/undo
  description: Redo the last undone change.
  aliases:
  - redo
  - undo the undo
  - reapply change
  help_tag: "CTRL-R"
  alternatives: [undo]
  setup_keys: "xu"
  example:
    before: "ab┃cd"
    after: "ab┃d"
  verified: example

- id: undo-line
  keys: "U"
  kind: command
  category: editing/undo
  description: Undo all recent changes on the last changed line.
  aliases:
  - undo all changes on this line
  - restore the line
  help_tag: "U"
  alternatives: [undo]
  setup_keys: "xxx"
  example:
    before: "ab┃cdef"
    after: "ab┃cdef"
  verified: example

- id: repeat-change
  keys: "."
  kind: command
  category: editing/repeat
  description: Repeat the last change.
  aliases:
  - repeat last command
  - do that again
  - redo the last edit on another spot
  - dot repeat
  help_tag: "."
  alternatives: [macro-replay, repeat-substitute]
  setup_keys: "dwj"
  example:
    before: "┃one two\nthree four"
    after: "two\n┃four"
  verified: example

- id: paste-after
  keys: "p"
  kind: command
  category: editing/paste
  description: Put (paste) the last yanked or deleted text after the cursor.
  aliases:
  - paste
  - paste after cursor
  - put text below or after
  - insert the copied text
  help_tag: "p"
  alternatives: [paste-before, paste-yank-register]
  setup_keys: "yy"
  example:
    before: "on┃e\ntwo"
    after: "one\n┃one\ntwo"
  verified: example

- id: paste-before
  keys: "P"
  kind: command
  category: editing/paste
  description: Put (paste) the last yanked or deleted text before the cursor.
  aliases:
  - paste before cursor
  - put text above or before
  help_tag: "P"
  alternatives: [paste-after]
  setup_keys: "yy"
  example:
    before: "on┃e\ntwo"
    after: "┃one\none\ntwo"
  verified: example

- id: yank-line
  keys: "yy"
  kind: command
  category: editing/yank
  description: Yank (copy) the current line.
  aliases:
  - copy a line
  - copy the current line
  - yank line
  help_tag: "yy"
  alternatives: [yank-lines-count, paste-after, duplicate-line]
  example:
    keys: "yyp"
    before: "on┃e\ntwo"
    after: "one\n┃one\ntwo"
  verified: example

- id: yank-lines-count
  keys: "{count}yy"
  kind: command
  category: editing/yank
  description: Yank (copy) {count} lines.
  aliases:
  - copy multiple lines
  - copy the next 3 lines
  help_tag: "yy"
  alternatives: [yank-line, yank-all]
  example:
    keys: "2yyGp"
    before: "on┃e\ntwo\nthree"
    after: "one\ntwo\nthree\n┃one\ntwo"
  verified: example

- id: yank-to-eol
  keys: "y$"
  kind: command
  category: editing/yank
  description: Yank (copy) from the cursor to the end of the line.
  aliases:
  - copy to end of line
  - copy rest of line
  help_tag: "y"
  alternatives: [yank-line, yank-word]
  example:
    keys: "y$P"
    before: "one ┃two"
    after: "one tw┃otwo"
  verified: example

- id: yank-word
  keys: "yiw"
  kind: command
  category: editing/yank
  description: Yank (copy) the word under the cursor.
  aliases:
  - copy a word
  - copy the current word
  - yank word under cursor
  help_tag: "iw"
  alternatives: [yank-line, paste-after]
  example:
    keys: "yiwP"
    before: "one tw┃o"
    after: "one tw┃otwo"
  verified: example

- id: yank-all
  keys: "ggyG"
  kind: command
  category: editing/yank
  description: Yank (copy) the whole buffer.
  aliases:
  - copy the whole file
  - copy everything
  - select all and copy
  - yank entire buffer
  help_tag: "yy"
  alternatives: [yank-all-ex, delete-all]
  example:
    keys: "ggyGGp"
    before: "on┃e\ntwo"
    after: "one\ntwo\n┃one\ntwo"
  verified: example

- id: yank-all-ex
  keys: ":%y"
  kind: ex
  mode: normal
  category: editing/yank
  description: Yank (copy) all lines (ex command).
  aliases:
  - copy whole file with colon command
  help_tag: ":y"
  alternatives: [yank-all]
  example:
    keys: ":%y<CR>Gp"
    before: "on┃e\ntwo"
    after: "one\ntwo\n┃one\ntwo"
  verified: example

- id: duplicate-line
  keys: "yyp"
  kind: command
  category: editing/lines
  description: Duplicate the current line below.
  aliases:
  - duplicate line
  - copy line below
  - repeat the current line
  - clone this line
  help_tag: "p"
  alternatives: [copy-line-ex, yank-line]
  example:
    before: "on┃e\ntwo"
    after: "one\n┃one\ntwo"
  verified: example

- id: copy-line-ex
  keys: ":t."
  kind: ex
  mode: normal
  category: editing/lines
  description: Duplicate the current line below (ex command).
  aliases:
  - duplicate line with colon command
  - copy line with t command
  help_tag: ":t"
  alternatives: [duplicate-line, move-line-down-ex]
  example:
    before: "on┃e\ntwo"
    after: "one\non┃e\ntwo"
  verified: example

- id: move-line-down-ex
  keys: ":m+1"
  kind: ex
  mode: normal
  category: editing/lines
  description: Move the current line down one line.
  aliases:
  - move line down
  - swap line with the one below
  - shift the current line downward
  help_tag: ":m"
  alternatives: [move-line-up-ex, swap-lines]
  example:
    before: "on┃e\ntwo\nthree"
    after: "two\non┃e\nthree"
  verified: example

- id: move-line-up-ex
  keys: ":m-2"
  kind: ex
  mode: normal
  category: editing/lines
  description: Move the current line up one line.
  aliases:
  - move line up
  - swap line with the one above
  - shift the current line upward
  help_tag: ":m"
  alternatives: [move-line-down-ex, swap-lines]
  example:
    before: "one\ntw┃o\nthree"
    after: "tw┃o\none\nthree"
  verified: example

- id: swap-lines
  keys: "ddp"
  kind: command
  category: editing/lines
  description: Swap the current line with the next one.
  aliases:
  - swap two lines
  - exchange this line with the one below
  help_tag: "p"
  alternatives: [move-line-down-ex, swap-chars]
  example:
    before: "on┃e\ntwo\nthree"
    after: "two\n┃one\nthree"
  verified: example

- id: swap-chars
  keys: "xp"
  kind: command
  category: editing/chars
  description: Swap the character under the cursor with the next one.
  aliases:
  - swap two characters
  - transpose characters
  - fix a typo by swapping letters
  help_tag: "p"
