  - whole block including braces
  help_tag: "a{"
  alternatives: [to-inner-brace]
  example:
    keys: "da{"
    before: "f() { ret┃urn 1; }"
    after: "f()┃ "
  sample: "f() { ret┃urn 1; } g() { }"
  verified: example

