- id: to-inner-double-quote
  keys: "i\""
  kind: textobject
  category: editing/text-objects
  description: Inside the nearest double-quoted string.
  noun: inside the double quotes
  aliases:
  - inside double quotes
  - contents of the string
  - text between quotes
  - inner quotes
  help_tag: iquote
  alternatives: [to-a-double-quote, to-inner-single-quote]
  example:
    keys: "di\""
    before: "say(\"hel┃lo\")"
    after: "say(\"┃\")"
  sample: "say(\"hel┃lo world\") + \"x\""
  verified: example

- id: to-a-double-quote
  keys: "a\""
  kind: textobject
