  noun: the double-quoted string with its quotes
  aliases:
  - around double quotes
  - string including the quotes
  help_tag: aquote
  alternatives: [to-inner-double-quote]
  example:
    keys: "da\""
    before: "say(\"hel┃lo\")"
    after: "say(┃)"
  sample: "x = \"hel┃lo world\" + y"
  verified: example

